[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-documents-markdown"
version = "0.2.0"
description = "Batch parse long PDFs with MinerU and rebuild structured Markdown outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "ruff>=0.9",
]

[project.scripts]
mineru-batch-parse = "mineru_documents_markdown.mineru_batch_parse:main"
mineru-validate-outputs = "mineru_documents_markdown.validate_outputs:main"
mineru-profile-documents = "mineru_documents_markdown.profile_documents:main"
mineru-build-structured-blocks = "mineru_documents_markdown.build_structured_blocks:main"
mineru-heading-quality = "mineru_documents_markdown.heading_quality:main"
mineru-build-regression-fixtures = "mineru_documents_markdown.regression_fixtures:main"
mineru-section-reasoning = "mineru_documents_markdown.section_reasoning.cli:main"
mineru-run-pipeline = "mineru_documents_markdown.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineru_documents_markdown = ["domains/*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["mineru_documents_markdown"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
