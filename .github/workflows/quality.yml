name: quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Strict mypy for new and refactored modules
        run: >-
          mypy --follow-imports=skip
          src/mineru_documents_markdown/defaults.py
          src/mineru_documents_markdown/domain_profiles.py
          src/mineru_documents_markdown/http_utils.py
          src/mineru_documents_markdown/io_utils.py
          src/mineru_documents_markdown/semantic_state.py
          src/mineru_documents_markdown/semantic_render.py
          src/mineru_documents_markdown/semantic_diagnostics.py
          src/mineru_documents_markdown/section_reasoning
      - run: coverage run -m unittest discover -s tests
      - run: coverage report
